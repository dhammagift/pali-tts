<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pali TTS тест</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--muted:#6b6560;--card:#fff;--line:#e6e0d8;--accent:#b5651d;--good:#2e7d32;--bad:#c62828;--best:#b8860b;--chip:#f1ece4;--mark:#ffd9d6}
@media (prefers-color-scheme:dark){:root{--bg:#16140f;--fg:#ece6dc;--muted:#a59d92;--card:#211e18;--line:#3a352c;--accent:#e0a060;--good:#66bb6a;--bad:#ef5350;--best:#f0c040;--chip:#2c2820;--mark:#5a2420}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif}
main{max-width:820px;margin:auto;padding:16px 16px 80px}
h1{font-size:1.35rem;margin:.2em 0}
.lead{color:var(--muted);font-size:.95rem}
.lead b{color:var(--fg)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.bar .status{margin-left:auto;color:var(--muted)}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
.words{font-style:italic;font-size:1.08rem;line-height:2}
.w{display:inline-block;padding:0 4px;margin:1px 0;border-radius:6px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.w:hover{background:var(--chip)}
.w.on{background:var(--mark);text-decoration:underline wavy var(--bad)}
.note{color:var(--muted);margin:2px 0 6px;font-size:.88rem}
h2.sec{font-size:1.15rem;margin:28px 0 4px}
section.multi .row .label{display:block}
.hint{color:var(--muted);font-size:.8rem;margin:0 0 6px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 0;border-top:1px solid var(--line)}
.row .name{flex:0 0 auto;font-weight:600;min-width:1.6em}
.row .label{display:none;flex:1 1 100%;font-size:.82rem;color:var(--accent);order:5}
body.reveal .row .label{display:block}
.row audio{flex:1 1 220px;min-width:0;height:36px}
.btns{display:flex;gap:6px}
.btns button{font:inherit;font-size:.88rem;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--fg);cursor:pointer;min-height:36px}
.btns .pl{min-width:40px;font-weight:700}
.btns button[data-v=best].sel{background:var(--best);border-color:var(--best);color:#111}
.btns button[data-v=ok].sel{background:var(--good);border-color:var(--good);color:#fff}
.btns button[data-v=bad].sel{background:var(--bad);border-color:var(--bad);color:#fff}
textarea{width:100%;margin-top:8px;font:inherit;font-size:.92rem;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);min-height:2.6em;resize:vertical}
details{font-size:.8rem;color:var(--muted)} code{word-break:break-word}
section.done{border-color:var(--good)}
</style>
</head>
<body>
<main>
<h1>espeak-ng: v</h1>
<p class="lead">Голос самого espeak, только v: «уши» слышат на её месте «м/н» во многих записях es1/es5. 12 фраз с v в разных местах, 4 варианта вперемешку. <b>★</b> где v звучит как v (не «м», не пропадает), <b>✓ норм</b>, <b>✗ плохо</b>.</p>
<div class="bar"><span id="progress"></span><label><input type="checkbox" id="reveal"> показать, кто есть кто</label><span class="status" id="status"></span></div>
<div id="list"></div>
</main>
<script>
const DATA = {"round": "es8", "phrases": [{"id": "p0", "text": "samaṇena vā brāhmaṇena vā devena vā", "note": "★ где v звучит как v (не «м», не пропадает)", "ipa": "", "script": "", "section": "espeak: v", "multi": false, "words": ["samaṇena", "vā", "brāhmaṇena", "vā", "devena", "vā"], "variants": [{"id": "a", "letter": "A", "label": "сейчас: русская в", "src": "audio/es8/p0.a.mp3?v=1791210577"}, {"id": "b", "letter": "B", "label": "обычная v (base)", "src": "audio/es8/p0.b.mp3?v=1791210577"}, {"id": "c", "letter": "C", "label": "хинди ʋ (было в es1)", "src": "audio/es8/p0.c.mp3?v=1791210577"}, {"id": "d", "letter": "D", "label": "итальянская v", "src": "audio/es8/p0.d.mp3?v=1791210577"}]}, {"id": "p1", "text": "Ekaṁ samayaṁ bhagavā", "note": "★ где v звучит как v (не «м», не пропадает)", "ipa": "", "script": "", "section": "espeak: v", "multi": false, "words": ["Ekaṁ", "samayaṁ", "bhagavā"], "variants": [{"id": "c", "letter": "A", "label": "хинди ʋ (было в es1)", "src": "audio/es8/p1.c.mp3?v=1791210577"}, {"id": "d", "letter": "B", "label": "итальянская v", "src": "audio/es8/p1.d.mp3?v=1791210577"}, {"id": "b", "letter": "C", "label": "обычная v (base)", "src": "audio/es8/p1.b.mp3?v=1791210577"}, {"id": "a", "letter": "D", "label": "сейчас: русская в", "src": "audio/es8/p1.a.mp3?v=1791210577"}]}, {"id": "p2", "text": "āvuso", "note": "★ где v звучит как v (не «м», не пропадает)", "ipa": "", "script": "", "section": "espeak: v", "multi": false, "words": ["āvuso"], "variants": [{"id": "a", "letter": "A", "label": "сейчас: русская в", "src": "audio/es8/p2.a.mp3?v=1791210577"}, {"id": "d", "letter": "B", "label": "итальянская v", "src": "audio/es8/p2.d.mp3?v=1791210577"}, {"id": "b", "letter": "C", "label": "обычная v (base)", "src": "audio/es8/p2.b.mp3?v=1791210577"}, {"id": "c", "letter": "D", "label": "хинди ʋ (было в es1)", "src": "audio/es8/p2.c.mp3?v=1791210577"}]}, {"id": "p3", "text": "vedanā", "note": "★ где v звучит как v (не «м», не пропадает)", "ipa": "", "script": "", "section": "espeak: v", "multi": false, "words": ["vedanā"], "variants": [{"id": "c", "letter": "A", "label": "хинди ʋ (было в es1)", "src": "audio/es8/p3.c.mp3?v=1791210577"}, {"id": "a", "letter": "B", "label": "сейчас: русская в", "src": "audio/es8/p3.a.mp3?v=1791210577"}, {"id": "d", "letter": "C", "label": "итальянская v", "src": "audio/es8/p3.d.mp3?v=1791210577"}, {"id": "b", "letter": "D", "label": "обычная v (base)", "src": "audio/es8/p3.b.mp3?v=1791210577"}]}, {"id": "p4", "text": "viññāṇa", "note": "★ где v звучит как v (не «м», не пропадает)", "ipa": "", "script": "", "section": "espeak: v", "multi": false, "words": ["viññāṇa"], "variants": [{"id": "b", "letter": "A", "label": "обычная v (base)", "src": "audio/es8/p4.b.mp3?v=1791210577"}, {"id": "c", "letter": "B", "label": "хинди ʋ (было в es1)", "src": "audio/es8/p4.c.mp3?v=1791210577"}, {"id": "a", "letter": "C", "label": "сейчас: русская в", "src": "audio/es8/p4.a.mp3?v=1791210577"}, {"id": "d", "letter": "D", "label": "итальянская v", "src": "audio/es8/p4.d.mp3?v=1791210577"}]}, {"id": "p5", "text": "Evaṁ me sutaṁ", "note": "★ где v звучит как v (не «м», не пропадает)", "ipa": "", "script": "", "section": "espeak: v", "multi": false, "words": ["Evaṁ", "me", "sutaṁ"], "variants": [{"id": "d", "letter": "A", "label": "итальянская v", "src": "audio/es8/p5.d.mp3?v=1791210577"}, {"id": "a", "letter": "B", "label": "сейчас: русская в", "src": "audio/es8/p5.a.mp3?v=1791210577"}, {"id": "c", "letter": "C", "label": "хинди ʋ (было в es1)", "src": "audio/es8/p5.c.mp3?v=1791210577"}, {"id": "b", "letter": "D", "label": "обычная v (base)", "src": "audio/es8/p5.b.mp3?v=1791210577"}]}, {"id": "p6", "text": "saddamanussāvesuṁ", "note": "★ где v звучит как v (не «м», не пропадает)", "ipa": "", "script": "", "section": "espeak: v", "multi": false, "words": ["saddamanussāvesuṁ"], "variants": [{"id": "d", "letter": "A", "label": "итальянская v", "src": "audio/es8/p6.d.mp3?v=1791210577"}, {"id": "b", "letter": "B", "label": "обычная v (base)", "src": "audio/es8/p6.b.mp3?v=1791210577"}, {"id": "a", "letter": "C", "label": "сейчас: русская в", "src": "audio/es8/p6.a.mp3?v=1791210577"}, {"id": "c", "letter": "D", "label": "хинди ʋ (было в es1)", "src": "audio/es8/p6.c.mp3?v=1791210577"}]}, {"id": "p7", "text": "avijjā", "note": "★ где v звучит как v (не «м», не пропадает)", "ipa": "", "script": "", "section": "espeak: v", "multi": false, "words": ["avijjā"], "variants": [{"id": "d", "letter": "A", "label": "итальянская v", "src": "audio/es8/p7.d.mp3?v=1791210577"}, {"id": "c", "letter": "B", "label": "хинди ʋ (было в es1)", "src": "audio/es8/p7.c.mp3?v=1791210577"}, {"id": "b", "letter": "C", "label": "обычная v (base)", "src": "audio/es8/p7.b.mp3?v=1791210577"}, {"id": "a", "letter": "D", "label": "сейчас: русская в", "src": "audio/es8/p7.a.mp3?v=1791210577"}]}, {"id": "p8", "text": "bhavataṇhā, vibhavataṇhā", "note": "★ где v звучит как v (не «м», не пропадает)", "ipa": "", "script": "", "section": "espeak: v", "multi": false, "words": ["bhavataṇhā,", "vibhavataṇhā"], "variants": [{"id": "a", "letter": "A", "label": "сейчас: русская в", "src": "audio/es8/p8.a.mp3?v=1791210577"}, {"id": "d", "letter": "B", "label": "итальянская v", "src": "audio/es8/p8.d.mp3?v=1791210577"}, {"id": "b", "letter": "C", "label": "обычная v (base)", "src": "audio/es8/p8.b.mp3?v=1791210577"}, {"id": "c", "letter": "D", "label": "хинди ʋ (было в es1)", "src": "audio/es8/p8.c.mp3?v=1791210577"}]}, {"id": "p9", "text": "sammāvāyāmo sammāvācā", "note": "★ где v звучит как v (не «м», не пропадает)", "ipa": "", "script": "", "section": "espeak: v", "multi": false, "words": ["sammāvāyāmo", "sammāvācā"], "variants": [{"id": "a", "letter": "A", "label": "сейчас: русская в", "src": "audio/es8/p9.a.mp3?v=1791210577"}, {"id": "b", "letter": "B", "label": "обычная v (base)", "src": "audio/es8/p9.b.mp3?v=1791210577"}, {"id": "c", "letter": "C", "label": "хинди ʋ (было в es1)", "src": "audio/es8/p9.c.mp3?v=1791210577"}, {"id": "d", "letter": "D", "label": "итальянская v", "src": "audio/es8/p9.d.mp3?v=1791210577"}]}, {"id": "p10", "text": "Dveme, bhikkhave, antā", "note": "★ где v звучит как v (не «м», не пропадает)", "ipa": "", "script": "", "section": "espeak: v", "multi": false, "words": ["Dveme,", "bhikkhave,", "antā"], "variants": [{"id": "b", "letter": "A", "label": "обычная v (base)", "src": "audio/es8/p10.b.mp3?v=1791210577"}, {"id": "c", "letter": "B", "label": "хинди ʋ (было в es1)", "src": "audio/es8/p10.c.mp3?v=1791210577"}, {"id": "a", "letter": "C", "label": "сейчас: русская в", "src": "audio/es8/p10.a.mp3?v=1791210577"}, {"id": "d", "letter": "D", "label": "итальянская v", "src": "audio/es8/p10.d.mp3?v=1791210577"}]}, {"id": "p11", "text": "vihāra", "note": "★ где v звучит как v (не «м», не пропадает)", "ipa": "", "script": "", "section": "espeak: v", "multi": false, "words": ["vihāra"], "variants": [{"id": "c", "letter": "A", "label": "хинди ʋ (было в es1)", "src": "audio/es8/p11.c.mp3?v=1791210577"}, {"id": "d", "letter": "B", "label": "итальянская v", "src": "audio/es8/p11.d.mp3?v=1791210577"}, {"id": "a", "letter": "C", "label": "сейчас: русская в", "src": "audio/es8/p11.a.mp3?v=1791210577"}, {"id": "b", "letter": "D", "label": "обычная v (base)", "src": "audio/es8/p11.b.mp3?v=1791210577"}]}]};
const API = (DATA.api || 'vote.php') + '?round=' + DATA.round;
const $ = (s, el = document) => el.querySelector(s);
let state = {};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

function key(p, kind, v = '') { return p + '|' + kind + '|' + v; }

async function save(phrase, kind, variant, value) {
  state[key(phrase, kind, variant)] = value;
  $('#status').textContent = 'сохраняю…';
  try {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify({ phrase, kind, variant, value }) });
    $('#status').textContent = r.ok ? 'сохранено ✓' : 'ошибка сохранения';
  } catch { $('#status').textContent = 'нет сети — не сохранено'; }
  progress();
}

function progress() {
  let n = 0;
  for (const p of DATA.phrases) {
    const done = p.variants.some(v => state[key(p.id, 'rating', v.id)] === 'best');
    document.getElementById(p.id).classList.toggle('done', done);
    if (done) n++;
  }
  $('#progress').textContent = `Оценено: ${n} из ${DATA.phrases.length}`;
}

function render() {
  const list = $('#list');
  let lastSection = '';
  for (const p of DATA.phrases) {
    if (p.section !== lastSection) {
      lastSection = p.section;
      const h = document.createElement('h2'); h.className = 'sec'; h.textContent = p.section; list.appendChild(h);
    }
    const sec = document.createElement('section');
    sec.id = p.id;
    if (p.multi) sec.classList.add('multi');
    const marked = new Set(state[key(p.id, 'words')] || []);
    sec.innerHTML = `
      <div class="words">${p.words.map((w, i) => `<span class="w${marked.has(i + ':' + w) ? ' on' : ''}" data-i="${i}">${w}</span>`).join(' ')}</div>
      <p class="note">${p.id} · ${p.note}</p>
      ${p.multi ? '' : '<p class="hint">нажмите на слово, которое лучший вариант читает неправильно</p>'}
      ${p.variants.map(v => `
        <div class="row" data-v="${v.id}">
          <span class="name">${v.letter}</span>
          <audio controls preload="none" src="${v.src}"></audio>
          <span class="btns">
            <button class="pl" title="Слушать / стоп">▶</button><button data-v="best">★ ${p.multi ? 'нравится' : 'лучший'}</button><button data-v="ok">✓ норм</button><button data-v="bad">✗ плохо</button>
          </span>
          <span class="label">${v.letter} = ${v.label}</span>
        </div>`).join('')}
      <textarea placeholder="Комментарий: что не так, как должно звучать…">${esc(state[key(p.id, 'comment')] || '')}</textarea>
      ${p.ipa ? `<details><summary>фонемы / письмо каннада</summary><code>${p.ipa}</code><br><code>${p.script}</code></details>` : ''}`;
    list.appendChild(sec);

    const paint = () => sec.querySelectorAll('.row').forEach(row => {
      const val = state[key(p.id, 'rating', row.dataset.v)];
      row.querySelectorAll('button').forEach(b => b.classList.toggle('sel', b.dataset.v === val));
    });
    paint();
    // small ▶ next to the ratings: listen and rate without reaching for the audio bar; one sound at a time
    sec.querySelectorAll('.row .pl').forEach(b => b.onclick = () => {
      const a = b.closest('.row').querySelector('audio');
      if (!a.paused) { a.pause(); return; }
      document.querySelectorAll('audio').forEach(x => { if (x !== a) x.pause(); });
      a.currentTime = 0; a.play();
    });
    sec.querySelectorAll('.row audio').forEach(a => {
      const b = a.closest('.row').querySelector('.pl');
      a.onplay = () => { document.querySelectorAll('audio').forEach(x => { if (x !== a) x.pause(); }); b.textContent = '■'; };
      a.onpause = a.onended = () => { b.textContent = '▶'; };
    });
    sec.querySelectorAll('.row button[data-v]').forEach(b => b.onclick = () => {
      const row = b.closest('.row'), vid = row.dataset.v;
      if (b.dataset.v === 'best' && !p.multi) {  // only one best per phrase: the old best becomes "ok"
        for (const v of p.variants) if (v.id !== vid && state[key(p.id, 'rating', v.id)] === 'best') save(p.id, 'rating', v.id, 'ok');
      }
      const cur = state[key(p.id, 'rating', vid)];
      save(p.id, 'rating', vid, cur === b.dataset.v ? '' : b.dataset.v);
      paint();
    });
    sec.querySelectorAll('.w').forEach(w => w.onclick = () => {
      w.classList.toggle('on');
      const on = [...sec.querySelectorAll('.w.on')].map(x => x.dataset.i + ':' + x.textContent);
      save(p.id, 'words', '', on);
    });
    let t;
    $('textarea', sec).oninput = e => { clearTimeout(t); t = setTimeout(() => save(p.id, 'comment', '', e.target.value), 700); };
  }
  // one player at a time
  document.addEventListener('play', e => document.querySelectorAll('audio').forEach(a => a !== e.target && a.pause()), true);
  progress();
}

$('#reveal').onchange = e => document.body.classList.toggle('reveal', e.target.checked);
fetch(API).then(r => r.json()).then(s => { state = s || {}; }).catch(() => {}).finally(render);
</script>
</body>
</html>
