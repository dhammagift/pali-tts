name: survey
# Noise floor / SNR / clipping for every human recording in dhammagift/audio (no ML, ffmpeg + numpy).
on: workflow_dispatch
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q numpy
      - run: python survey.py out/survey
      - uses: actions/upload-artifact@v4
        with:
          name: survey
          path: out/survey/survey.json
