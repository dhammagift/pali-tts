name: gtts
# Lines of Pali in Devanagari read by Google's own TTS engine (its Sanskrit voice) on an Android emulator; the wavs are
# the artifact. gtts/lines.tsv: id<TAB>text, gtts/voice.txt: the locale. Owner 2026-11-13: data for our own Pali voice.
on:
  workflow_dispatch:
    inputs:
      minutes: {description: 'how long to wait for the app', default: '30'}
jobs:
  gtts:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - name: Build the app with the lines inside
        run: |
          mkdir -p gtts/src/main/assets && cp gtts/lines.tsv gtts/voice.txt gtts/src/main/assets/
          cd gtts && gradle -q assembleDebug
          mv build/outputs/apk/debug/*.apk build/outputs/apk/debug/gtts-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env: {MINUTES: '${{ inputs.minutes }}'}
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          script: ./gtts/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: gtts, path: out/}
