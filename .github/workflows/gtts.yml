name: gtts
# Lines of Pali in Devanagari read by Google's own TTS engine (its Sanskrit voice) on an Android emulator; the wavs are
# the artifact. gtts/lines.tsv: id<TAB>text, gtts/voice.txt: the locale. Owner 2026-11-13: data for our own Pali voice.
on:
  workflow_dispatch:
    inputs:
      minutes: {description: 'how long to wait for the app', default: '30'}
      lines: {description: 'the lines file', default: 'gtts/lines.tsv'}
      rate: {description: 'speech rate instead of gtts/rate.txt (empty: the file)', default: ''}
      shards: {description: 'parallel emulators: line k goes to shard k mod shards (1-8)', default: '8'}
jobs:
  gtts:
    runs-on: ubuntu-latest
    strategy:  # the Google TTS of api 34's (2023-01) and 35's images has no Sanskrit; 36's (2024-11) has sa-IN
      fail-fast: false
      matrix: {api: ['36'], shard: [0, 1, 2, 3, 4, 5, 6, 7]}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - name: Build the app with the lines inside
        run: |
          mkdir -p gtts/src/main/assets && cp gtts/voice.txt gtts/rate.txt gtts/src/main/assets/
          # this job's share of the lines (owner 2026-11-16: progress has to be seen - each shard's artifact lands when it is done)
          awk -v n=${{ inputs.shards }} -v k=${{ matrix.shard }} '(NR - 1) % n == k' ${{ inputs.lines }} > gtts/src/main/assets/lines.tsv
          if [ -n '${{ inputs.rate }}' ]; then echo '${{ inputs.rate }}' > gtts/src/main/assets/rate.txt; fi
          if [ ${{ matrix.shard }} -ge ${{ inputs.shards }} ]; then : > gtts/src/main/assets/lines.tsv; fi
          wc -l gtts/src/main/assets/lines.tsv
          cd gtts && gradle -q assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env: {MINUTES: '${{ inputs.minutes }}'}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          script: ./gtts/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'gtts-${{ matrix.api }}-${{ matrix.shard }}', path: out/}
