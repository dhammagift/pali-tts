name: dataset
# Cut the owner's Pali recordings into aligned, denoised clips for Piper fine-tuning.
on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Manifest of recordings to process
        default: dataset/test.json
concurrency: dataset
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dataset.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/torch
          key: torch-hub-mms-fa
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements-dataset.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          curl -sfL -o deep-filter https://github.com/Rikorose/DeepFilterNet/releases/download/v0.5.6/deep-filter-0.5.6-x86_64-unknown-linux-musl
          chmod +x deep-filter
      - name: Prepare
        run: python prepare.py "${{ inputs.manifest }}" out/ds
      - uses: actions/upload-artifact@v4
        with:
          name: review
          path: |
            out/ds/review
            out/ds/clips.json
      - uses: actions/upload-artifact@v4
        with:
          name: train
          path: |
            out/ds/train
            out/ds/clips.json
